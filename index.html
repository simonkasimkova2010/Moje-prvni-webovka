<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moje první webovka</title>
  <link rel="icon" href="ikona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="uvod">
    <h1>Piškvorky</h1>
    <div class="menu">
      <button id="offline">👥 Kamarád vedle mě</button>
      <button id="bot">🤖 Proti botovi</button>
    </div>
    <h2>Online s kamarádem</h2>
    <button id="vytvorit">Vytvořit hru</button>
    <p>nebo zadej kód od kamaráda:</p>
    <input id="kod" inputmode="numeric" maxlength="4" placeholder="1234">
    <button id="pripojit">Připojit se</button>
    <p id="zprava"></p>
  </div>

  <div id="hra" hidden>
    <h2 id="stav"></h2>
    <div id="deska"></div>
    <button id="znovu">Nová hra</button>
    <button id="menu">Menu</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
